---
# tasks file for ansible-role_upgrade
#

- name: Ensure fact os_family is gathered
  ansible.builtin.setup:
    filter: os_family
  when: ansible_facts['os_family'] is not defined

- name: Ensure OS family is displayed
  ansible.builtin.debug:
    msg: "OS family {{ ansible_facts['os_family'] }} detected"

- name: Ensure correct tasks are run based on the OS family
  ansible.builtin.include_tasks: "{{ ansible_facts['os_family'] }}.yml"
